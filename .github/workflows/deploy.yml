name: 🚀 Deploy to VPS

on:
  push:
    branches:
      - master

jobs:
  deploy:
    name: Deploy Superencasa to VPS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Execute Deploy Script via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_PORT || 22222 }}
          username: ${{ secrets.VPS_USER || 'root' }}
          password: ${{ secrets.VPS_PASSWORD }}
          script_stop: true
          script: |
            cd /var/www/supermercadoencasa
            bash deploy.sh
